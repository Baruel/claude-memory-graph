/* Themes. The canvas reads these same tokens, so a theme is just one block here.
   --sat/--lum: project palette; --region: workspace fill alpha; --glow: node blur px;
   --grid: background grid color (transparent = none); --font: UI + canvas type;
   --hues: optional fixed workspace hues (else golden-angle spread);
   --card-*: floating card material (fill, border, shadow, backdrop blur), --radius, --clip (card outline),
   --field: input/button fill inside cards; --scan: full-screen overlay (scanlines). */
:root, :root[data-theme="paper"]{
  --bg:#f6f4ef; --surface:#fffdf8; --ink:#1d1b17; --muted:#77716a; --line:#d9d3c8;
  --edge:rgba(40,34,26,.16); --edge-hi:rgba(40,34,26,.75); --hub:#1d1b17; --focus:#c2410c;
  --sat:62; --lum:48; --region:.07; --glow:0; --grid:transparent; --hues:;
  --font:ui-sans-serif,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --card-bg:#fffdf8; --card-border:1px solid #e3ddd2; --card-blur:none; --radius:14px; --clip:none;
  --card-shadow:0 1px 2px rgba(40,34,26,.06),0 10px 28px rgba(40,34,26,.09);
  --field:#f6f4ef; --scan:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#121110; --surface:#1b1a18; --ink:#ece8e1; --muted:#9a948b; --line:#33302b;
    --edge:rgba(236,232,225,.13); --edge-hi:rgba(236,232,225,.8); --hub:#ece8e1; --focus:#fb923c;
    --sat:60; --lum:58; --region:.08;
    --card-bg:rgba(30,29,27,.62); --card-border:1px solid rgba(236,232,225,.1); --card-blur:blur(18px) saturate(140%);
    --card-shadow:0 12px 36px rgba(0,0,0,.4); --field:rgba(255,255,255,.06);
  }
}
/* ink: frosted smoked glass */
:root[data-theme="ink"]{
  --bg:#121110; --surface:#1b1a18; --ink:#ece8e1; --muted:#9a948b; --line:#33302b;
  --edge:rgba(236,232,225,.13); --edge-hi:rgba(236,232,225,.8); --hub:#ece8e1; --focus:#fb923c;
  --sat:60; --lum:58; --region:.08;
  --card-bg:rgba(30,29,27,.62); --card-border:1px solid rgba(236,232,225,.1); --card-blur:blur(18px) saturate(140%);
  --card-shadow:0 12px 36px rgba(0,0,0,.4); --field:rgba(255,255,255,.06);
}
/* blueprint: translucent drafting overlays, hairline borders, square corners */
:root[data-theme="blueprint"]{
  --bg:#0f3a6b; --surface:#134577; --ink:#e8f1ff; --muted:#9fbde0; --line:#2f6aa6;
  --edge:rgba(232,241,255,.22); --edge-hi:rgba(255,255,255,.9); --hub:#ffffff; --focus:#ffd166;
  --sat:40; --lum:80; --region:.05; --grid:rgba(232,241,255,.07);
  --font:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card-bg:rgba(15,58,107,.42); --card-border:1px solid rgba(232,241,255,.5); --card-blur:blur(3px);
  --card-shadow:none; --radius:2px; --field:rgba(232,241,255,.07);
}
/* neon: airy dark glass, soft glow only (kept light: Cyber is the heavy one) */
:root[data-theme="neon"]{
  --bg:#0e0d18; --surface:#16142a; --ink:#f1eeff; --muted:#9a94b8; --line:#2c2846;
  --edge:rgba(190,175,255,.09); --edge-hi:rgba(220,210,255,.75); --hub:#f1eeff; --focus:#7dffb0;
  --sat:88; --lum:68; --region:.035; --glow:4;
  --card-bg:rgba(26,23,44,.5); --card-border:1px solid rgba(190,175,255,.16); --card-blur:blur(16px) saturate(130%);

  --field:rgba(255,255,255,.04);
}
/* print: opaque paper, hard rules, no shadow */
:root[data-theme="print"]{
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#666666; --line:#cccccc;
  --edge:rgba(0,0,0,.2); --edge-hi:rgba(0,0,0,.85); --hub:#111111; --focus:#111111;
  --sat:0; --lum:38; --region:.035;
  --font:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --card-bg:#ffffff; --card-border:1.5px solid #111111; --card-shadow:none; --radius:0; --field:#ffffff;

:root[data-theme="claude"]{
  --bg:#f3f1e9; --surface:#faf9f5; --ink:#1f1e1b; --muted:#857f72; --line:#e3dfd2;

  --font:"Iowan Old Style","Palatino Linotype",Georgia,serif;

  --bg:#141414; --surface:#1d1d1d; --ink:#e6e6e6; --muted:#8a8a8a; --line:#2c2c2c;
  --edge:rgba(230,230,230,.08); --edge-hi:rgba(97,175,239,.9); --hub:#e6e6e6; --focus:#61afef;

  --card-bg:#1b1b1b; --card-border:1px solid #2c2c2c; --card-blur:none; --radius:8px;
  --card-shadow:0 10px 30px rgba(0,0,0,.45); --field:#242424;
}
/* cyber: monochrome green-phosphor terminal (1980s command center): box-drawing double lines,
   CRT bloom, scanlines + vignette, Plex Mono. Workspaces differ by slight hue/lightness shifts only. */
:root[data-theme="cyber"]{
  --bg:#010805; --surface:#03120a; --ink:#b8ffd4; --muted:#3f9a66; --line:#0d4a2a;
  --edge:rgba(0,204,106,.16); --edge-hi:rgba(120,255,180,.95); --hub:#7dffb2; --focus:#eafff1;
  --sat:100; --lum:44; --region:.04; --glow:8; --grid:rgba(0,204,106,.06); --hues:150,138,162,126,174;
  --font:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card-bg:rgba(1,12,6,.86); --card-border:3px double rgba(0,204,106,.75); --card-blur:blur(2px);
  --card-shadow:0 0 14px rgba(0,204,106,.22),inset 0 0 22px rgba(0,204,106,.06); --radius:0;
  --field:rgba(0,204,106,.06); --text-glow:0 0 6px rgba(0,255,136,.4);
  --scan:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px),
         radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.45 var(--font);overflow:hidden;text-shadow:var(--text-glow,none)}
/* floating cards: one material per theme, set by the --card-* tokens */
header,#legend,#panel,#themes,#tip{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);
  box-shadow:var(--card-shadow);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);clip-path:var(--clip)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:var(--scan);z-index:20}
/* --hdr is the header's live height (set from JS), so nothing slides under a wrapped header */
#themes{position:fixed;right:16px;top:calc(var(--hdr,56px) + 28px);width:230px;padding:6px;z-index:7}
#themes button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:8px;padding:6px 8px;
  text-align:left;background:transparent;font-size:13px}
#themes button:hover,#themes button:focus-visible{background:var(--bg)}
#themes button[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--muted)}
.prev{width:44px;height:26px;border-radius:6px;flex:none;position:relative;border:1px solid rgba(127,127,127,.3);overflow:hidden}
.prev i{position:absolute;width:7px;height:7px;border-radius:50%}
.prev i:nth-child(1){left:7px;top:5px}.prev i:nth-child(2){left:19px;top:13px;width:9px;height:9px}.prev i:nth-child(3){left:31px;top:6px}
#c{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
header{position:fixed;top:16px;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:9px 10px 9px 18px;z-index:6}
h1{font-size:15px;font-weight:600;margin:0 8px 0 0;letter-spacing:-.01em}
.stat{color:var(--muted);font-size:12px}
.credit{color:var(--muted);font-size:12px;margin-right:auto;padding-left:10px;border-left:1px solid var(--line)}
.credit a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.credit a:hover,.credit a:focus-visible{border-bottom-color:var(--ink)}
.credit a.star{margin-left:8px;padding:2px 9px;border:1px solid var(--line);border-radius:min(999px,calc(var(--radius) * 99));background:var(--field)}
.credit a.star:hover,.credit a.star:focus-visible{border-color:var(--focus);color:var(--focus)}
@media (max-width:1280px){.stat{display:none}.credit{border-left:0;padding-left:0}}
input[type=search]{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:min(999px,calc(var(--radius) * 99));
  padding:7px 14px;font:inherit;width:180px;max-width:100%}
button{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:min(999px,calc(var(--radius) * 99));
  padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
button[aria-pressed="false"]{opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#legend{position:fixed;left:16px;bottom:16px;max-height:45vh;overflow:auto;padding:10px 8px;width:240px;z-index:5}
#legend h2,#panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 4px 6px;font-weight:600}
.proj{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:8px;padding:4px 6px;text-align:left;background:transparent}
.proj:hover{background:var(--bg)}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.proj .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.proj.ws{margin-top:4px}
.key{margin:6px 4px 12px;font-size:11px;line-height:1.45;color:var(--muted)}
#types{display:flex;flex-wrap:wrap;gap:4px;margin:0 2px}
#types button{padding:3px 9px;font-size:11px}
.proj.sub{padding-left:24px;font-size:12px}
.proj.sub .sw{width:8px;height:8px}
#panel{position:fixed;top:calc(var(--hdr,56px) + 28px);right:16px;width:340px;max-height:calc(100vh - var(--hdr,56px) - 44px);overflow:auto;padding:16px 18px;display:none;z-index:5}
#panel.open{display:block}
#panel h3{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
#panel .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
#panel .desc{margin:0 0 12px}
#panel.wide{width:460px}
#panel .body{font-size:13px;line-height:1.6;margin:4px 0 14px}
#panel .body p{margin:0 0 9px}
#panel .body h4{font-size:13px;margin:12px 0 4px}
#panel .body ul{list-style:disc;padding-left:18px;margin:0 0 9px}
#panel .body li{margin:2px 0}
#panel .body code{font:12px ui-monospace,Menlo,monospace;background:var(--field);padding:1px 4px;border-radius:4px;display:inline;margin:0;color:var(--ink);word-break:break-word}
#panel .body pre{font:11.5px/1.5 ui-monospace,Menlo,monospace;background:var(--field);padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:0 0 9px;border-radius:min(8px,var(--radius))}
#panel .body pre.tbl{margin:0;padding:1px 10px;border-radius:0}
#panel .body a{color:var(--ink)}
#panel .body .wl{display:inline;border:0;padding:0;background:none;font:inherit;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
#panel .body .wl.dead{color:var(--muted);cursor:help}
#panel code{font:11px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all;display:block;margin-bottom:12px}
#panel ul{list-style:none;margin:0;padding:0}
#panel li button{border:0;background:transparent;padding:3px 0;text-align:left;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
#close{position:absolute;top:10px;right:10px;padding:2px 9px}
#panel .hits li button{text-decoration:none;width:100%;padding:6px 6px;border-radius:8px;line-height:1.35}
#panel .hits li button:hover,#panel .hits li button:focus-visible{background:var(--bg)}
#panel .hits .pj{color:var(--muted);font-size:12px}
#panel .hits .sn{color:var(--muted);font-size:12px}
#panel .wsh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 6px 2px;font-weight:600}
#panel .back{border:0;background:transparent;padding:0;margin-bottom:8px;color:var(--muted);text-decoration:underline}
#tip{position:fixed;pointer-events:none;padding:7px 10px;font-size:12px;max-width:280px;display:none;z-index:8}
#tip b{display:block;font-weight:600}
#tip span{color:var(--muted)}
@media (max-width:640px){
  #legend{display:none}
  #panel{left:16px;right:16px;width:auto;top:auto;bottom:16px;max-height:50vh}
  #themes{top:auto;bottom:16px;left:16px;right:16px;width:auto}
  input[type=search]{width:100%}
}
</style>
</head>

    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } };
  for (const line of src.split('\n')) {
    if (fence) { if (/^```/.test(line)) { out.push(`<pre>${esc(fence.join('\n'))}</pre>`); fence = null; } else fence.push(line); continue; }
    if (/^```/.test(line)) { flush(); fence = []; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)/), li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (h) { flush(); out.push(`<h4>${inline(h[2])}</h4>`); }
    else if (li) { if (para.length) { const l = list; list = null; flush(); list = l; } (list = list || []).push(`<li>${inline(li[1])}</li>`); }
    else if (/^\s*\|/.test(line)) { flush(); out.push(`<pre class="tbl">${esc(line)}</pre>`); }
    else if (!line.trim()) flush();
    else { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } para.push(line.trim()); }
  }
  if (fence) out.push(`<pre>${esc(fence.join('\n'))}</pre>`);
  flush();
  return out.join('');
}

function open(n){
  selected = n; const p = $('#panel');
  if (!n) { p.classList.remove('open'); draw(); return; }
  const out = links.filter(l => l.s === n).map(l => l.t), inn = links.filter(l => l.t === n).map(l => l.s);
  const list = (title, arr) => arr.length ? `<h2>${title}</h2><ul>${arr.map(m => `<li><button data-id="${esc(m.id)}">${esc(m.name)}<span style="color:var(--muted)"> · ${esc(m.project)}</span></button></li>`).join('')}</ul>` : '';
  $('#pbody').innerHTML = (query ? '<button class="back" data-back>← results</button>' : '') + (n.hub
    ? `<h3>${esc(n.name)}</h3><div class="meta">project · ${nodes.filter(m=>m.project===n.project).length} memories</div>` +
      list('Memories', nodes.filter(m => m.project === n.project).sort((a,b) => b.date.localeCompare(a.date)))
    : `<h3>${esc(n.name)}</h3><div class="meta"><span class="sw" style="display:inline-block;background:${pcolor(n.project)}"></span> ${esc(n.project)} · ${esc(n.type)} · modified ${n.date} · ${(n.size/1024).toFixed(1)} KB</div>
       <p class="desc">${esc(n.desc || '—')}</p><code>${esc(n.file)}</code>` +
       (n.body ? `<h2>Memory</h2><div class="body">${md(n.body, n)}</div>` : '') +
       list('Links to', out) + list('Linked from', inn));
  p.classList.toggle('wide', !n.hub && !!n.body);
  p.classList.add('open'); draw();
}
$('#pbody').onclick = e => {
  if (e.target.closest('[data-back]')) return showResults();
  const b = e.target.closest('[data-id]'); if (!b) return;
  const n = byId.get(b.dataset.id); touched = true;  // stop auto-fit from undoing the jump
  view.x = n.x; view.y = n.y; view.k = Math.max(view.k, 1.4); open(n); };

new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('header').offsetHeight + 'px'))
  .observe($('header'));
// null = never chosen (use Omarchy when present); '' = the viewer explicitly picked Auto
let saved = null; try { saved = localStorage.getItem('cmg-theme'); } catch {}
setTheme(saved !== null && THEMES.some(t => t.id === saved) ? saved : DATA.omarchy ? 'omarchy' : '');
addEventListener('resize', resize); resize();
// Warm-up: run the chaotic first part of the layout off-screen, then show only a calm final settle.
// The step budget shrinks for big graphs (each step is O(n²)) so the page never stalls.
Object.assign(PHYS, {damp: .82, cap: 30});
for (let i = 0, N = Math.min(400, Math.floor(4e7 / (all.length * all.length))); i < N && alpha > .12; i++) step();
Object.assign(PHYS, {damp: .55, cap: 10});
all.forEach(n => { n.vx *= .2; n.vy *= .2; });  // hand over to the calm physics without a jolt
alpha = Math.min(alpha, .2); fit(true);
requestAnimationFrame(tick);
</script>
</body>
